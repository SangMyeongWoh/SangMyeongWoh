<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 368" width="760" height="368" role="img" aria-label="용어집 처리 흐름">
<style>
  .bg  { fill: #ffffff; }
  .pan { fill: #f4f8f7; stroke: #dce5e2; }
  .box { fill: #ffffff; stroke: #dce5e2; }
  .hot { stroke: #0b6b5c; }
  .ink { fill: #16211f; }
  .sub { fill: #33403e; }
  .mut { fill: #6b7c79; }
  .acc { fill: #0b6b5c; }
  .ln  { stroke: #6b7c79; }
  .ah  { fill: #6b7c79; }
  .dl  { stroke: #9db0ab; }
  .ahd { fill: #9db0ab; }
  @media (prefers-color-scheme: dark) {
    .bg  { fill: #0d1413; }
    .pan { fill: #101817; stroke: #26332f; }
    .box { fill: #0d1413; stroke: #26332f; }
    .hot { stroke: #6fdcc6; }
    .ink { fill: #e6edea; }
    .sub { fill: #bcc9c6; }
    .mut { fill: #849692; }
    .acc { fill: #6fdcc6; }
    .ln  { stroke: #849692; }
    .ah  { fill: #849692; }
    .dl  { stroke: #46564f; }
    .ahd { fill: #5d716a; }
  }
  text { font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; }
  .t { font-size: 14.5px; font-weight: 700; }
  .s { font-size: 12px; }
  .k { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; }
  rect { stroke-width: 1.2; }
  .hot { stroke-width: 1.7; }
  .ln, .dl { fill: none; stroke-width: 1.4; }
  .dl { stroke-dasharray: 4 4; }
</style>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path class="ah" d="M0.5 0.6 L9 4.5 L0.5 8.4 z"/></marker><marker id="d" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path class="ahd" d="M0.5 0.6 L9 4.5 L0.5 8.4 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="760" height="368"/>
<text class="k acc" x="16" y="26">등록할 때</text>
<rect class="box" x="16" y="36" width="228" height="58" rx="9"/>
<text class="t ink" x="30" y="60">용어 입력</text>
<text class="s mut" x="30" y="79">원문 + 언어별 번역</text>
<path class="ln" d="M244 65 L270 65" marker-end="url(#a)"/>
<rect class="box" x="274" y="36" width="228" height="58" rx="9"/>
<text class="t ink" x="288" y="60">정규화형 계산</text>
<text class="s mut" x="288" y="79">언어별로 비교 가능한 형태로</text>
<path class="ln" d="M502 65 L528 65" marker-end="url(#a)"/>
<rect class="box" x="532" y="36" width="212" height="58" rx="9"/>
<text class="t ink" x="546" y="60">저장</text>
<text class="s mut" x="546" y="79">원문형 + 정규화형 함께</text>
<path class="dl" d="M388 108 L388 140" marker-end="url(#d)"/>
<text class="k mut" x="400" y="130">같은 정규화 규칙</text>
<text class="k acc" x="16" y="168">매칭할 때</text>
<rect class="box" x="16" y="178" width="160" height="58" rx="9"/>
<text class="t sub" x="30" y="212">문장</text>
<path class="ln" d="M176 207 L202 207" marker-end="url(#a)"/>
<rect class="box hot" x="206" y="178" width="296" height="58" rx="9"/>
<text class="t ink" x="220" y="202">언어별 두 경로</text>
<text class="s mut" x="220" y="221">한·일·중: 표면 그대로 스캔</text>
<text class="s mut" x="220" y="236">영어·유럽어: 단어 원형으로 비교</text>
<path class="ln" d="M502 207 L528 207" marker-end="url(#a)"/>
<rect class="box" x="532" y="178" width="212" height="58" rx="9"/>
<text class="t ink" x="546" y="202">오탐 거르기</text>
<text class="s mut" x="546" y="221">단어 경계 · 명사 검증</text>
<path class="ln" d="M388 250 L388 272" marker-end="url(#a)"/>
<rect class="box" x="16" y="276" width="728" height="46" rx="9"/>
<text class="t sub" x="30" y="304">매칭 결과 — 기계번역 · 교정 · 평가에 공급</text>
<text class="s mut" x="16" y="350">저장할 때와 매칭할 때 같은 규칙으로 정규화합니다. 이 대칭이 깨지면 매칭이 통째로 실패합니다.</text>
</svg>
