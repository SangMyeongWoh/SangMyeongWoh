<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 338" width="760" height="338" role="img" aria-label="평가 처리 흐름">
<style>
  .bg  { fill: #ffffff; }
  .pan { fill: #f4f8f7; stroke: #dce5e2; }
  .box { fill: #ffffff; stroke: #dce5e2; }
  .hot { stroke: #0b6b5c; }
  .ink { fill: #16211f; }
  .sub { fill: #33403e; }
  .mut { fill: #6b7c79; }
  .acc { fill: #0b6b5c; }
  .ln  { stroke: #6b7c79; }
  .ah  { fill: #6b7c79; }
  .dl  { stroke: #9db0ab; }
  .ahd { fill: #9db0ab; }
  
    .bg  { fill: #0d1413; }
    .pan { fill: #101817; stroke: #26332f; }
    .box { fill: #0d1413; stroke: #26332f; }
    .hot { stroke: #6fdcc6; }
    .ink { fill: #e6edea; }
    .sub { fill: #bcc9c6; }
    .mut { fill: #849692; }
    .acc { fill: #6fdcc6; }
    .ln  { stroke: #849692; }
    .ah  { fill: #849692; }
    .dl  { stroke: #46564f; }
    .ahd { fill: #5d716a; }
  
  text { font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; }
  .t { font-size: 14.5px; font-weight: 700; }
  .s { font-size: 12px; }
  .k { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; }
  rect { stroke-width: 1.2; }
  .hot { stroke-width: 1.7; }
  .ln, .dl { fill: none; stroke-width: 1.4; }
  .dl { stroke-dasharray: 4 4; }
</style>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path class="ah" d="M0.5 0.6 L9 4.5 L0.5 8.4 z"/></marker><marker id="d" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path class="ahd" d="M0.5 0.6 L9 4.5 L0.5 8.4 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="760" height="338"/>
<rect class="box" x="16" y="14" width="344" height="42" rx="9"/>
<text class="t sub" x="30" y="40">번역 완료본</text>
<path class="ln" d="M188 56 L188 76" marker-end="url(#a)"/>
<rect class="box" x="16" y="80" width="344" height="58" rx="9"/>
<text class="t ink" x="30" y="104">규칙 검사</text>
<text class="s mut" x="30" y="123">태그·미번역·숫자 등 확정 오류 — LLM 없이</text>
<path class="ln" d="M188 138 L188 158" marker-end="url(#a)"/>
<rect class="box" x="16" y="162" width="344" height="58" rx="9"/>
<text class="t ink" x="30" y="186">용어 대조</text>
<text class="s mut" x="30" y="205">지정 용어를 썼는지 용어집으로 확인</text>
<path class="ln" d="M360 191 L372 191 L372 43"/>
<path class="ln" d="M372 43 L396 43" marker-end="url(#a)"/>
<rect class="box hot" x="400" y="14" width="344" height="58" rx="9"/>
<text class="t ink" x="414" y="38">LLM 심판</text>
<text class="s mut" x="414" y="57">원문과 대조해 오역·누락·문법 탐지</text>
<path class="ln" d="M572 72 L572 92" marker-end="url(#a)"/>
<rect class="box" x="400" y="96" width="344" height="74" rx="9"/>
<text class="t ink" x="414" y="120">근거 검증</text>
<text class="s mut" x="414" y="139">지정 용어를 잘못됐다고 지적할 경우 감점 무효화</text>
<text class="s mut" x="414" y="155">그 외 틀린 지적도 기각 — 용어집이 권위</text>
<path class="ln" d="M572 170 L572 190" marker-end="url(#a)"/>
<rect class="box" x="400" y="194" width="344" height="58" rx="9"/>
<text class="t ink" x="414" y="218">감점 · 점수</text>
<text class="s mut" x="414" y="237">사내 채점 기준(MQM 기반) · 합격선 근처는 재채점</text>
<path class="ln" d="M572 252 L572 272" marker-end="url(#a)"/>
<rect class="box" x="400" y="276" width="344" height="42" rx="9"/>
<text class="t sub" x="414" y="302">채점 리포트</text>
