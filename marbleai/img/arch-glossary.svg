<text class="t ink" x="62" y="136">용어집 API · Cloud Run Service</text>
<text class="s mut" x="62" y="158">매칭 엔진: Aho-Corasick + 형태소 분석기</text>
<rect class="box" x="30" y="170" width="346" height="66" rx="8"/>
<text class="t ink" x="44" y="192">match</text>
<text class="s mut" x="44" y="211">원문에서 용어를 찾아 정답 번역과 함께 반환</text>
<text class="s mut" x="44" y="227">기계번역이 프롬프트에 넣을 때 사용</text>
<rect class="box" x="384" y="170" width="346" height="66" rx="8"/>
<text class="t ink" x="398" y="192">validate</text>
<text class="s mut" x="398" y="211">번역문에 지정 용어가 제대로 쓰였는지 확인</text>
<text class="s mut" x="398" y="227">기본형으로 격변화 대응 · 무결성 검사 · 평가가 사용</text>
<text class="s mut" x="30" y="258">Aho-Corasick 매칭 인덱스는 메모리 → GCS 순으로 찾고, 없거나 용어가 바뀌었으면 DB에서 다시 만들어 저장합니다.</text>
<path class="ln" d="M380 272 L380 296" marker-end="url(#a)"/>
<rect class="box" x="16" y="300" width="728" height="42" rx="9"/>
<text class="t ink" x="30" y="326">용어 원본 · Cloud SQL</text>
<text class="s mut" x="260" y="326">원문형 + 기본형 · 등록 · 관리는 플랫폼 웹에서</text>
</svg>
