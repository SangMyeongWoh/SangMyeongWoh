<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 356" width="760" height="356" role="img" aria-label="용어집 구성 — 기계번역·원본 교정·평가가 용어집 API를 조회. API 안에 match(원문에서 용어 찾기, 기계번역 프롬프트용)와 validate(번역문의 용어 사용 확인, 기본형으로 격변화 대응, 기계번역 무결성 검사와 평가가 사용). Aho-Corasick 매칭 인덱스는 메모리·GCS에 캐시하고 용어가 바뀌면 DB에서 다시 만듦.">
<style>
