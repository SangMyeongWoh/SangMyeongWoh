<text class="t ink" x="62" y="136">용어집 API · Cloud Run Service</text>
<text class="s mut" x="62" y="158">매칭 엔진: Aho-Corasick + 형태소 분석기 · 내부 전용</text>
<rect class="box" x="30" y="170" width="346" height="66" rx="8"/>
<text class="t ink" x="44" y="192">match</text>
<text class="s mut" x="44" y="211">원문에서 용어를 찾아 정답 번역과 함께 반환</text>
<text class="s mut" x="44" y="227">기계번역 · 원본 교정이 프롬프트에 넣음</text>
<rect class="box" x="384" y="170" width="346" height="66" rx="8"/>
<text class="t ink" x="398" y="192">validate</text>
<text class="s mut" x="398" y="211">번역문에 지정 용어가 제대로 쓰였는지 확인</text>
<text class="s mut" x="398" y="227">정규화형으로 격변화 대응 · 무결성 검사 · 평가기가 사용</text>
<path class="ln" d="M380 248 L380 272" marker-end="url(#a)"/>
<text class="k acc" x="16" y="292">조회는 빠른 순서대로</text>
<rect class="box" x="16" y="302" width="236" height="58" rx="9"/>
<text class="t ink" x="30" y="326">① 메모리 캐시</text>
<text class="s mut" x="30" y="345">프로세스 안 — 방금 쓴 구조</text>
<path class="ln" d="M252 331 L278 331" marker-end="url(#a)"/>
<rect class="box" x="282" y="302" width="236" height="58" rx="9"/>
<text class="t ink" x="296" y="326">② GCS 캐시</text>
<text class="s mut" x="296" y="345">미리 구워둔 검색 구조</text>
<path class="ln" d="M518 331 L544 331" marker-end="url(#a)"/>
<rect class="box" x="548" y="302" width="196" height="58" rx="9"/>
<text class="t ink" x="562" y="326">③ Cloud SQL</text>
<text class="s mut" x="562" y="345">원문형 + 정규화형</text>
<text class="s mut" x="16" y="390">용어가 바뀌면 캐시가 자동으로 새로 구워집니다 — 매칭을 고쳐도 기계번역 재배포가 필요 없습니다.</text>
