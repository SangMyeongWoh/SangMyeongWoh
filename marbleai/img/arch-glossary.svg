<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 348" width="760" height="348" role="img" aria-label="용어집 구성">
<style>
  .bg  { fill: #ffffff; }
  .pan { fill: #f4f8f7; stroke: #dce5e2; }
  .box { fill: #ffffff; stroke: #dce5e2; }
  .hot { stroke: #0b6b5c; }
  .ink { fill: #16211f; }
  .sub { fill: #33403e; }
  .mut { fill: #6b7c79; }
  .acc { fill: #0b6b5c; }
  .ln  { stroke: #6b7c79; }
  .ah  { fill: #6b7c79; }
  .dl  { stroke: #9db0ab; }
  .ahd { fill: #9db0ab; }
  @media (prefers-color-scheme: dark) {
    .bg  { fill: #0d1413; }
    .pan { fill: #101817; stroke: #26332f; }
    .box { fill: #0d1413; stroke: #26332f; }
    .hot { stroke: #6fdcc6; }
    .ink { fill: #e6edea; }
    .sub { fill: #bcc9c6; }
    .mut { fill: #849692; }
    .acc { fill: #6fdcc6; }
    .ln  { stroke: #849692; }
    .ah  { fill: #849692; }
    .dl  { stroke: #46564f; }
    .ahd { fill: #5d716a; }
  }
  text { font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; }
  .t { font-size: 14.5px; font-weight: 700; }
  .s { font-size: 12px; }
  .k { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; }
  rect { stroke-width: 1.2; }
  .hot { stroke-width: 1.7; }
  .ln, .dl { fill: none; stroke-width: 1.4; }
  .dl { stroke-dasharray: 4 4; }
</style>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path class="ah" d="M0.5 0.6 L9 4.5 L0.5 8.4 z"/></marker><marker id="d" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path class="ahd" d="M0.5 0.6 L9 4.5 L0.5 8.4 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="760" height="348"/>
<rect class="box" x="16" y="14" width="228" height="42" rx="9"/>
<text class="t sub" x="30" y="40">기계번역</text>
<rect class="box" x="266" y="14" width="228" height="42" rx="9"/>
<text class="t sub" x="280" y="40">원본 교정</text>
<rect class="box" x="516" y="14" width="228" height="42" rx="9"/>
<text class="t sub" x="530" y="40">평가</text>
<path class="ln" d="M130 56 L130 84 L630 84 L630 56"/>
<path class="ln" d="M380 56 L380 84"/>
<path class="ln" d="M380 84 L380 108" marker-end="url(#a)"/>
<rect class="box hot" x="16" y="112" width="728" height="76" rx="9"/>
<text class="t ink" x="30" y="136">용어집 API · Cloud Run Service</text>
<text class="s mut" x="30" y="155">FastAPI · 8 vCPU / 16 GiB · 최소 3대 상시 · 최대 60대</text>
<text class="s mut" x="30" y="170">매칭 엔진: Aho-Corasick + 형태소 분석기(kiwi · spaCy) · 내부 전용</text>
<path class="ln" d="M380 188 L380 212" marker-end="url(#a)"/>
<text class="k acc" x="16" y="232">조회는 빠른 순서대로</text>
<rect class="box" x="16" y="242" width="236" height="58" rx="9"/>
<text class="t ink" x="30" y="266">① 메모리 캐시</text>
<text class="s mut" x="30" y="285">프로세스 안 — 방금 쓴 구조</text>
<path class="ln" d="M252 271 L278 271" marker-end="url(#a)"/>
<rect class="box" x="282" y="242" width="236" height="58" rx="9"/>
<text class="t ink" x="296" y="266">② GCS 캐시</text>
<text class="s mut" x="296" y="285">미리 구워둔 검색 구조</text>
<path class="ln" d="M518 271 L544 271" marker-end="url(#a)"/>
<rect class="box" x="548" y="242" width="196" height="58" rx="9"/>
<text class="t ink" x="562" y="266">③ Cloud SQL</text>
<text class="s mut" x="562" y="285">원문형 + 정규화형</text>
<text class="s mut" x="16" y="330">용어가 바뀌면 캐시가 자동으로 새로 구워집니다 — 매칭을 고쳐도 기계번역 재배포가 필요 없습니다.</text>
</svg>
