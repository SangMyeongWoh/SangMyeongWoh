<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="용어집 구성">
<style>
  .bg  { fill: #ffffff; }
  .pan { fill: #f4f8f7; stroke: #dce5e2; }
  .box { fill: #ffffff; stroke: #dce5e2; }
  .hot { stroke: #0b6b5c; }
  .ink { fill: #16211f; }
  .sub { fill: #33403e; }
  .mut { fill: #6b7c79; }
  .acc { fill: #0b6b5c; }
  .ln  { stroke: #6b7c79; }
  .dl  { stroke: #9db0ab; }
  @media (prefers-color-scheme: dark) {
    .bg  { fill: #0d1413; }
    .pan { fill: #101817; stroke: #26332f; }
    .box { fill: #0d1413; stroke: #26332f; }
    .hot { stroke: #6fdcc6; }
    .ink { fill: #e6edea; }
    .sub { fill: #bcc9c6; }
    .mut { fill: #849692; }
    .acc { fill: #6fdcc6; }
    .ln  { stroke: #849692; }
    .dl  { stroke: #46564f; }
  }
  text { font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; }
  .t { font-size: 14.5px; font-weight: 700; }
  .s { font-size: 12px; }
  .k { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; }
  rect { stroke-width: 1.2; }
  .hot { stroke-width: 1.7; }
  .ln, .dl { fill: none; stroke-width: 1.4; }
  .dl { stroke-dasharray: 4 4; }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b7c79"/></marker><marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9db0ab"/></marker></defs>
<rect class="bg" x="0" y="0" width="760" height="330"/>
<rect class="box" x="16" y="14" width="228" height="42" rx="9"/>
<text class="t sub" x="30" y="40">기계번역</text>
<rect class="box" x="266" y="14" width="228" height="42" rx="9"/>
<text class="t sub" x="280" y="40">원본 교정</text>
<rect class="box" x="516" y="14" width="228" height="42" rx="9"/>
<text class="t sub" x="530" y="40">평가</text>
<path class="ln" d="M130 56 L130 84 L630 84 L630 56"/>
<path class="ln" d="M380 56 L380 84"/>
<path class="ln" d="M380 84 L380 108" marker-end="url(#a)"/>
<rect class="box hot" x="16" y="112" width="728" height="58" rx="9"/>
<text class="t ink" x="30" y="136">용어집 API 서비스</text>
<text class="s mut" x="30" y="155">매칭 엔진 + 용어 관리 — 항상 켜져 있는 공용 서비스</text>
<path class="ln" d="M380 170 L380 194" marker-end="url(#a)"/>
<text class="k acc" x="16" y="214">조회는 빠른 순서대로</text>
<rect class="box" x="16" y="224" width="236" height="58" rx="9"/>
<text class="t ink" x="30" y="248">① 메모리 캐시</text>
<text class="s mut" x="30" y="267">방금 쓴 검색 구조</text>
<path class="ln" d="M252 253 L278 253" marker-end="url(#a)"/>
<rect class="box" x="282" y="224" width="236" height="58" rx="9"/>
<text class="t ink" x="296" y="248">② 저장소 캐시</text>
<text class="s mut" x="296" y="267">미리 구워둔 검색 구조</text>
<path class="ln" d="M518 253 L544 253" marker-end="url(#a)"/>
<rect class="box" x="548" y="224" width="196" height="58" rx="9"/>
<text class="t ink" x="562" y="248">③ 용어 DB</text>
<text class="s mut" x="562" y="267">원문형 + 정규화형</text>
<text class="s mut" x="16" y="312">용어가 바뀌면 캐시가 자동으로 새로 구워집니다 — 매칭을 고쳐도 기계번역 재배포가 필요 없습니다.</text>
</svg>
