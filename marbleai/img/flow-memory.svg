<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 406" width="760" height="406" role="img" aria-label="기존 번역 파일 전처리 흐름 — 굽기 산출물 4종과 번역 시 주입">
<style>
  .bg  { fill: #ffffff; }
  .pan { fill: #f4f8f7; stroke: #dce5e2; }
  .box { fill: #ffffff; stroke: #dce5e2; }
  .hot { stroke: #0b6b5c; }
  .ink { fill: #16211f; }
  .sub { fill: #33403e; }
  .mut { fill: #6b7c79; }
  .acc { fill: #0b6b5c; }
  .ln  { stroke: #6b7c79; }
  .ah  { fill: #6b7c79; }
  .dl  { stroke: #9db0ab; }
  .ahd { fill: #9db0ab; }
  @media (prefers-color-scheme: dark) {
    .bg  { fill: #0d1413; }
    .pan { fill: #101817; stroke: #26332f; }
    .box { fill: #0d1413; stroke: #26332f; }
    .hot { stroke: #6fdcc6; }
    .ink { fill: #e6edea; }
    .sub { fill: #bcc9c6; }
    .mut { fill: #849692; }
    .acc { fill: #6fdcc6; }
    .ln  { stroke: #849692; }
    .ah  { fill: #849692; }
    .dl  { stroke: #46564f; }
    .ahd { fill: #5d716a; }
  }
  text { font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; }
  .t { font-size: 14.5px; font-weight: 700; }
  .s { font-size: 12px; }
  .k { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; }
  rect { stroke-width: 1.2; }
  .hot { stroke-width: 1.7; }
  .ln, .dl { fill: none; stroke-width: 1.4; }
  .dl { stroke-dasharray: 4 4; }
</style>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path class="ah" d="M0.5 0.6 L9 4.5 L0.5 8.4 z"/></marker><marker id="d" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path class="ahd" d="M0.5 0.6 L9 4.5 L0.5 8.4 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="760" height="406"/>
<text class="k acc" x="16" y="26">한 번만 — 자산을 등록할 때</text>
<rect class="box" x="280" y="36" width="200" height="54" rx="9"/>
<text class="t ink" x="294" y="60">기존 번역 파일</text>
<text class="s mut" x="294" y="79">게임에 쌓인 번역</text>
<path class="ln" d="M380 90 V114" marker-end="url(#a)"/>
<rect class="pan" x="16" y="122" width="728" height="116" rx="9"/>
<text class="k acc" x="30" y="143">굽기 — 한 번 구우면 재사용</text>
<text class="s sub" x="30" y="162">같은 자산이면 다시 굽지 않습니다</text>
<rect class="box" x="30" y="172" width="166" height="52" rx="9"/>
<text class="t ink" x="44" y="196">태그 규칙</text>
<text class="s mut" x="44" y="215">예시 · 복구 · 평가</text>
<rect class="box" x="208" y="172" width="166" height="52" rx="9"/>
<text class="t ink" x="222" y="196">벡터 인덱스</text>
<text class="s mut" x="222" y="215">유사 문장 few-shot</text>
<rect class="box" x="386" y="172" width="166" height="52" rx="9"/>
<text class="t ink" x="400" y="196">캐릭터 페르소나</text>
<text class="s mut" x="400" y="215">화자별 말투</text>
<rect class="box" x="564" y="172" width="166" height="52" rx="9"/>
<text class="t ink" x="578" y="196">대화 청크</text>
<text class="s mut" x="578" y="215">화자 매칭 few-shot</text>
<path class="ln" d="M380 238 V262" marker-end="url(#a)"/>
<rect class="box hot" x="170" y="270" width="420" height="54" rx="9"/>
<text class="t ink" x="184" y="294">번역할 때 자동 주입</text>
<text class="s mut" x="184" y="313">유사 문장 · 페르소나 · 태그 규칙</text>
<rect class="pan" x="16" y="344" width="728" height="46" rx="9"/>
<text class="k acc" x="30" y="365">실패해도 번역은 멈추지 않음</text>
<text class="s sub" x="30" y="384">벡터가 아직이면 기다렸다 직접 만들고, 그래도 안 되면 few-shot 없이 진행</text>
</svg>