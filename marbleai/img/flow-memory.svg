<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" width="760" height="312" role="img" aria-label="번역 기억 전처리 흐름 — 기존 번역 파일을 자동 분해해 검색 구조로 굽고, 유사 문장·캐릭터 말투·태그 보호 규칙을 만들어 기계번역 프롬프트에 자동 주입합니다.">
<style>
  .bg  { fill: #ffffff; }
  .pan { fill: #f4f8f7; stroke: #dce5e2; }
  .box { fill: #ffffff; stroke: #dce5e2; }
  .hot { stroke: #0b6b5c; }
  .ink { fill: #16211f; }
  .sub { fill: #33403e; }
  .mut { fill: #6b7c79; }
  .acc { fill: #0b6b5c; }
  .ln  { stroke: #6b7c79; }
  .ah  { fill: #6b7c79; }
  @media (prefers-color-scheme: dark) {
    .bg  { fill: #0d1413; }
    .pan { fill: #101817; stroke: #26332f; }
    .box { fill: #0d1413; stroke: #26332f; }
    .hot { stroke: #6fdcc6; }
    .ink { fill: #e6edea; }
    .sub { fill: #bcc9c6; }
    .mut { fill: #849692; }
    .acc { fill: #6fdcc6; }
    .ln  { stroke: #849692; }
    .ah  { fill: #849692; }
  }
  text { font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; }
  .t { font-size: 14.5px; font-weight: 700; }
  .s { font-size: 12px; }
  .k { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; }
  rect { stroke-width: 1.2; }
  .hot { stroke-width: 1.7; }
  .ln  { fill: none; stroke-width: 1.4; }
</style>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="9" refY="4.5" orient="auto"><path class="ah" d="M0.5 0.6 L9 4.5 L0.5 8.4 z"/></marker></defs>
<rect class="bg" x="0" y="0" width="760" height="312"/>

<text class="k acc" x="16" y="26">한 번만 — 자산 등록 시</text>
<rect class="box" x="16" y="36" width="190" height="58" rx="9"/>
<text class="t ink" x="30" y="60">기존 번역 파일</text>
<text class="s mut" x="30" y="79">게임에 쌓인 번역 자산</text>

<path class="ln" d="M206 65 L234 65" marker-end="url(#a)"/>

<rect class="box" x="238" y="36" width="190" height="58" rx="9"/>
<text class="t ink" x="252" y="60">자동 분해</text>
<text class="s mut" x="252" y="79">열 구조 인식 · 문장 정렬</text>

<path class="ln" d="M428 65 L456 65" marker-end="url(#a)"/>

<rect class="box hot" x="460" y="36" width="284" height="58" rx="9"/>
<text class="t ink" x="474" y="60">검색 구조로 굽기</text>
<text class="s mut" x="474" y="79">임베딩 · 화자별 대화 · 태그 추출</text>

<path class="ln" d="M602 94 L602 114 L132 114 L132 130" marker-end="url(#a)"/>
<path class="ln" d="M602 94 L602 114 L380 114 L380 130" marker-end="url(#a)"/>
<path class="ln" d="M602 94 L602 114 L628 114 L628 130" marker-end="url(#a)"/>

<rect class="box" x="16" y="134" width="232" height="56" rx="9"/>
<text class="t ink" x="30" y="158">유사 문장 검색</text>
<text class="s mut" x="30" y="177">문장마다 비슷한 기존 번역</text>

<rect class="box" x="264" y="134" width="232" height="56" rx="9"/>
<text class="t ink" x="278" y="158">캐릭터 말투</text>
<text class="s mut" x="278" y="177">화자별 대화 묶음</text>

<rect class="box" x="512" y="134" width="232" height="56" rx="9"/>
<text class="t ink" x="526" y="158">태그 보호 규칙</text>
<text class="s mut" x="526" y="177">패턴 자동 추출 · 분류</text>

<path class="ln" d="M132 190 L132 208"/>
<path class="ln" d="M380 190 L380 208"/>
<path class="ln" d="M628 190 L628 208"/>
<path class="ln" d="M132 208 L628 208"/>
<path class="ln" d="M380 208 L380 224" marker-end="url(#a)"/>

<rect class="box" x="270" y="228" width="220" height="52" rx="9"/>
<text class="t ink" x="284" y="250">기계번역 프롬프트</text>
<text class="s mut" x="284" y="269">번역할 때마다 자동 주입</text>

<text class="s mut" x="16" y="304">내용 기반 캐시로 같은 자산은 한 번만 굽습니다 — 전처리가 실패해도 번역은 멈추지 않습니다.</text>
</svg>
