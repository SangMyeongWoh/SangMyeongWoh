<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img"
     aria-label="경력과 학력 타임라인 — 넷마블 2023년 5월부터 현재까지 AI플랫폼 개발팀 AI 서비스 개발. 데이터헌트 2022년 10월부터 2023년 4월까지 NLP 엔지니어. 테스트웍스 2021년 6월부터 2022년 9월까지 NLP 엔지니어. 아크릴 2019년 7월부터 2021년 6월까지 NLP 엔지니어. 성균관대학교 컴퓨터공학 석사 2017년 3월부터 2019년 8월. 성균관대학교 전기전자공학 컴퓨터공학 복수전공 2010년 3월부터 2017년 3월.">
  <title>경력 · 학력</title>
  <style>
    .sans { font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif }
    .mono { font-family:ui-monospace,'SF Mono','Cascadia Mono',Consolas,monospace }
    .co   { fill:#16211F; font-size:17px; font-weight:700 }
    .role { fill:#4A5C59; font-size:14.5px; font-weight:500 }
    .per  { fill:#7B8D89; font-size:12px; font-weight:600 }
    .line { stroke:#D3DCD9; stroke-width:1.6 }
    .dot  { fill:#FFFFFF; stroke:#0B6B5C; stroke-width:2.4 }
    .edu  { fill:#FFFFFF; stroke:#9AAAA6; stroke-width:2.2 }
    .now  { fill:#0B6B5C }
    @media (prefers-color-scheme: dark) {
      .co{fill:#E6EDEA} .role{fill:#A9B8B5} .per{fill:#7F918D}
      .line{stroke:#2B3A38} .dot{fill:#0D1211; stroke:#6FDCC6}
      .edu{fill:#0D1211; stroke:#6B7C79} .now{fill:#6FDCC6}
    }
  </style>

  <line class="line" x1="150" y1="26" x2="150" y2="386"/>

  <g class="sans">
    <text class="mono per" x="128" y="31" text-anchor="end">2023.05 ~</text>
    <circle class="now" cx="150" cy="26" r="6"/>
    <text class="co"   x="176" y="32">넷마블</text>
    <text class="role" x="176" y="54">AI플랫폼 개발팀 · AI 서비스 개발</text>

    <text class="mono per" x="128" y="103" text-anchor="end">2022.10 – 2023.04</text>
    <circle class="dot" cx="150" cy="98" r="5.4"/>
    <text class="co"   x="176" y="104">데이터헌트</text>
    <text class="role" x="176" y="126">NLP 엔지니어 · 한국어 모델 NER 학습 자동화</text>

    <text class="mono per" x="128" y="175" text-anchor="end">2021.06 – 2022.09</text>
    <circle class="dot" cx="150" cy="170" r="5.4"/>
    <text class="co"   x="176" y="176">테스트웍스</text>
    <text class="role" x="176" y="198">NLP 엔지니어 · 텍스트 증강, 화학 논문 NLU</text>

    <text class="mono per" x="128" y="247" text-anchor="end">2019.07 – 2021.06</text>
    <circle class="dot" cx="150" cy="242" r="5.4"/>
    <text class="co"   x="176" y="248">아크릴</text>
    <text class="role" x="176" y="270">NLP 엔지니어 · 챗봇 빌더, NLU 고도화</text>

    <text class="mono per" x="128" y="319" text-anchor="end">2017.03 – 2019.08</text>
    <circle class="edu" cx="150" cy="314" r="5.4"/>
    <text class="co"   x="176" y="320">성균관대학교 <tspan class="role" font-size="15">컴퓨터공학 석사</tspan></text>
    <text class="role" x="176" y="342">정보 및 지능시스템 연구실</text>

    <text class="mono per" x="128" y="391" text-anchor="end">2010.03 – 2017.03</text>
    <circle class="edu" cx="150" cy="386" r="5.4"/>
    <text class="co"   x="176" y="392">성균관대학교 <tspan class="role" font-size="15">학사</tspan></text>
    <text class="role" x="176" y="414">전기전자공학 · 컴퓨터공학 복수전공</text>
  </g>
</svg>
