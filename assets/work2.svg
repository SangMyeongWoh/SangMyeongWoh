<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" width="760" height="236" role="img"
     aria-label="프로젝트: MarbleAI 언어파트 — 게임 로컬라이제이션 LLM 파이프라인 프로젝트 리딩 2023.05~; MARGE — 기업 문서 지식 Q and A 엔진 공동 개발 2024.06-2026.04. 활동·수상: 특허 등록 제10-2456513호 텍스트 데이터 증강; IEEE CIG Runner-up; 넷마블 Game Development Forum 발표 2023 2024">
  <title>프로젝트 · 활동 · 수상</title>
  <style>
    text { font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif }
