<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 244" width="760" height="244" role="img"
     aria-label="우상명 Sangmyeong Woh, AI Engineer. 7년차 NLP·AI 엔지니어입니다. 문제 정의부터 개발, 기획, 운영 등 풀스택 영역에서 AI를 활용해 빠르게 구현합니다. 근무지: 넷마블 AI플랫폼 개발팀, 서울. 핵심역량: LLM 파이프라인 설계와 운영, 업무 자동화와 에이전트 시스템, 비개발 부서와의 협업과 소통.">
  <title>우상명 · Sangmyeong Woh — AI Engineer</title>
  <style>
    :root { color-scheme: light dark; }
    .sans { font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif }
    .mono { font-family:ui-monospace,'SF Mono','Cascadia Mono',Consolas,'D2Coding',monospace }
    .ink    { fill:#16211F }
    .sub    { fill:#33403E }
    .muted  { fill:#6B7C79 }
    .accent { fill:#0B6B5C }
    .rule   { stroke:#DCE5E2 }
    .panel  { fill:#F4F8F7 }
    .bullet { fill:#0B6B5C }
    @media (prefers-color-scheme: dark) {
      .ink{fill:#E6EDEA} .sub{fill:#BCC9C6} .muted{fill:#849692}
      .accent{fill:#6FDCC6} .rule{stroke:#26332F} .panel{fill:#101817} .bullet{fill:#6FDCC6}
    }
  </style>

  <rect class="panel" x="0" y="0" width="760" height="244" rx="14"/>

  <g class="sans">
    <text x="24" y="52" class="mono accent" font-size="20" letter-spacing="4.5" font-weight="700">AI ENGINEER</text>
    <text x="22" y="100" class="ink" font-size="40" font-weight="800" letter-spacing="-1.2">우상명</text>
    <text x="24" y="122" class="mono muted" font-size="12.5" letter-spacing="2.2" font-weight="600">SANGMYEONG WOH</text>
    <text x="24" y="154" class="sub" font-size="13.5" font-weight="500">7년차 NLP &#183; AI 엔지니어입니다</text>
    <text x="24" y="178" class="sub" font-size="13.5" font-weight="500">문제 정의부터 개발&#183;기획&#183;운영 등</text>
    <text x="24" y="197" class="sub" font-size="13.5" font-weight="500">풀스택 영역에서 AI를 활용해</text>
    <text x="24" y="216" class="sub" font-size="13.5" font-weight="500">빠르게 구현합니다</text>
  </g>

  <line x1="380" y1="28" x2="380" y2="228" class="rule" stroke-width="1"/>

  <g>
    <g class="sans accent" font-size="13.5" letter-spacing="0.6" font-weight="700">
      <text x="408" y="60">근무지</text>
      <text x="408" y="130">핵심역량</text>
    </g>

    <g class="sans">
      <text x="408" y="86" class="ink" font-size="15" font-weight="500">넷마블 AI플랫폼 개발팀 &#183; 서울</text>
      <g class="sub" font-size="15">
        <text x="408" y="156"><tspan class="bullet">&#8226;</tspan>&#160;&#160;LLM 파이프라인 설계와 운영</text>
        <text x="408" y="178"><tspan class="bullet">&#8226;</tspan>&#160;&#160;업무 자동화 &#183; 에이전트 시스템</text>
        <text x="408" y="200"><tspan class="bullet">&#8226;</tspan>&#160;&#160;비개발 부서와의 협업과 소통</text>
      </g>
    </g>

    <line x1="408" y1="104" x2="736" y2="104" class="rule" stroke-width="1"/>
  </g>
</svg>
