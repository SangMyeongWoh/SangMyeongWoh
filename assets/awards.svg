<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" width="760" height="150" role="img" aria-label="활동·수상 — 특허 등록 제102456513호 텍스트 데이터 증강, IEEE CIG runner-up, 넷마블 Game Development Forum 발표 2023 2024">
  <title>활동 · 수상</title>
  <style>
    text { font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif }
