      .panel{fill:#101817} .h{fill:#E6EDEA} .nm{fill:#E6EDEA} .it{fill:#E6EDEA}
      .ds{fill:#A9B8B5} .mk{fill:#6FDCC6} .go{fill:#6FDCC6} .ey{fill:#7F918D} .thin{stroke:#26332F}
    }
