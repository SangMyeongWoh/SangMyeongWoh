<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img"
     aria-label="우상명 Sangmyeong Woh — AI Engineer. 게임 현지화 LLM 파이프라인 설계와 운영. 넷마블 AI플랫폼, MarbleAI 언어파트 프로젝트 리딩.">
  <title>우상명 · Sangmyeong Woh — AI Engineer</title>
  <style>
    .sans { font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif; }
    .mono { font-family: ui-monospace,'SF Mono','Cascadia Mono','Consolas','D2Coding',monospace; }
    .row  { opacity: 0; animation: in .5s ease-out forwards; }
    .r1 { animation-delay: .15s } .r2 { animation-delay: .35s }
    .r3 { animation-delay: .55s } .r4 { animation-delay: .75s }
    .chip { opacity: 0; animation: in .5s ease-out .95s forwards; }
    @keyframes in { from { opacity: 0; transform: translateX(-6px) } to { opacity: 1; transform: none } }
    @media (prefers-reduced-motion: reduce) {
      .row, .chip { animation: none; opacity: 1 }
    }
  </style>

  <rect width="1200" height="300" rx="12" fill="#0F1719"/>

  <!-- 정체성 -->
  <g class="sans">
    <text x="56" y="84" class="mono" fill="#F0A93B" font-size="12.5" letter-spacing="5.5" font-weight="600">AI ENGINEER</text>
    <text x="54" y="152" fill="#E6EDEA" font-size="56" font-weight="800" letter-spacing="-1.5">우상명<tspan
          dx="30" fill="#7A8B88" font-size="23" font-weight="600" letter-spacing="0.4">Sangmyeong Woh</tspan></text>
    <text x="56" y="196" fill="#C3CFCB" font-size="19.5" font-weight="500">게임 현지화 LLM 파이프라인 설계 · 운영</text>
    <text x="56" y="232" fill="#6B7C79" font-size="15">넷마블 AI플랫폼 &#183; MarbleAI 언어파트 프로젝트 리딩</text>
  </g>

  <!-- 로컬라이제이션 문자열 패널 -->
  <g>
    <rect x="656" y="46" width="488" height="208" rx="10" fill="#141F1E" stroke="#22302E" stroke-width="1"/>
    <text x="680" y="76" class="mono" fill="#5E706D" font-size="11.5" letter-spacing="1.6">STRING TABLE</text>
    <g class="chip">
      <rect x="1052" y="60" width="70" height="22" rx="11" fill="#F0A93B" fill-opacity="0.12" stroke="#F0A93B" stroke-opacity="0.45"/>
      <text x="1087" y="75.5" class="mono" fill="#F0A93B" font-size="11.5" font-weight="700" text-anchor="middle">LQE 98</text>
    </g>
    <line x1="680" y1="92" x2="1120" y2="92" stroke="#22302E" stroke-width="1"/>

    <g class="mono" font-size="14.5">
      <g class="row r1">
        <text x="680" y="124" fill="#4FB6A5" font-weight="700">ko</text>
        <text x="722" y="124" fill="#D5DEDB"><tspan fill="#F0A93B">{PLAYER}</tspan>님, 환영합니다</text>
      </g>
      <g class="row r2">
        <text x="680" y="156" fill="#5E706D">en</text>
        <text x="722" y="156" fill="#A9B7B4">Welcome, <tspan fill="#F0A93B">{PLAYER}</tspan></text>
      </g>
      <g class="row r3">
        <text x="680" y="188" fill="#5E706D">ja</text>
        <text x="722" y="188" fill="#A9B7B4"><tspan fill="#F0A93B">{PLAYER}</tspan>さん、ようこそ</text>
      </g>
      <g class="row r4">
        <text x="680" y="220" fill="#5E706D">zh</text>
        <text x="722" y="220" fill="#A9B7B4">欢迎，<tspan fill="#F0A93B">{PLAYER}</tspan></text>
      </g>
    </g>
  </g>
</svg>
