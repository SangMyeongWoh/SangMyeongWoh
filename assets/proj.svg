<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 200" width="372" height="200" role="img" aria-label="프로젝트 — MarbleAI 언어파트: 게임 현지화 LLM 파이프라인 프로젝트 리딩. nDIS: 사내 문서 관리 RAG 챗봇. 클릭하면 MarbleAI 포트폴리오로 이동합니다.">
  <title>프로젝트</title>
  <style>
    text { font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif }
    .panel { fill:#F4F8F7 }
    .h  { fill:#16211F; font-size:19px; font-weight:800; letter-spacing:-.2px }
    .it { fill:#16211F; font-size:14.5px; font-weight:700 }
    .ds { fill:#4A5C59; font-size:12.5px; font-weight:500 }
    .mk { fill:#0B6B5C }
    .go { fill:#0B6B5C; font-size:12px; font-weight:700 }
    .thin { stroke:#DCE5E2; stroke-width:1 }
    @media (prefers-color-scheme: dark) {
      .panel{fill:#101817} .h{fill:#E6EDEA} .it{fill:#E6EDEA} .ds{fill:#A9B8B5}
      .mk{fill:#6FDCC6} .go{fill:#6FDCC6} .thin{stroke:#26332F}
    }
  </style>
  <rect class="panel" x="0" y="0" width="372" height="200" rx="14"/>
  <text x="28" y="34" class="h">프로젝트</text>
  <line class="thin" x1="28" y1="46" x2="344" y2="46"/>
  <rect class="mk" x="28" y="65" width="5" height="5" rx="1.4"/>
  <text x="44" y="70" class="it">MarbleAI 언어파트</text>
  <text x="44" y="89" class="ds">게임 현지화 LLM 파이프라인 · 프로젝트 리딩</text>
  <rect class="mk" x="28" y="111" width="5" height="5" rx="1.4"/>
  <text x="44" y="116" class="it">nDIS</text>
  <text x="44" y="135" class="ds">사내 문서 관리 + RAG 챗봇</text>
  <text x="344" y="176" class="go" text-anchor="end">포트폴리오 보기 →</text>
</svg>
