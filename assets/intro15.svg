<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 228" width="760" height="228" role="img"
     aria-label="우상명, AI Engineer. 8년차 NLP·AI 엔지니어입니다. 문제 정의부터 개발, 기획, 운영 등 풀스택 영역에서 AI를 활용해 빠르게 구현합니다. 근무지: 넷마블 AI플랫폼 개발팀, 서울. 핵심역량: LLM 파이프라인 설계와 운영, 업무 자동화와 에이전트 시스템, 비개발 부서와의 협업과 소통.">
  <title>우상명 · Sangmyeong Woh — AI Engineer</title>
  <style>
    :root { color-scheme: light dark; }
    .sans { font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif }
    .mono { font-family:ui-monospace,'SF Mono','Cascadia Mono',Consolas,'D2Coding',monospace }
    .ink    { fill:#151a24 }
    .sub    { fill:#343a48 }
    .muted  { fill:#6b7385 }
    .accent { fill:#7a5c10 }
    .rule   { stroke:#dde1ea }
    .panel  { fill:#f4f5f8 }
    .bullet { fill:#7a5c10 }
    @media (prefers-color-scheme: dark) {
      .ink{fill:#e9e8e4} .sub{fill:#c5c5c0} .muted{fill:#8e919b}
      .accent{fill:#e3c77a} .rule{stroke:#2a3040} .panel{fill:#151922} .bullet{fill:#e3c77a}
    }
  </style>

  <rect class="panel" x="0" y="0" width="760" height="228" rx="14"/>

  <g class="sans">
    <text x="24" y="52" class="mono accent" font-size="20" letter-spacing="4.5" font-weight="700">AI ENGINEER</text>
    <text x="22" y="100" class="ink" font-size="40" font-weight="800" letter-spacing="-1.2">우상명</text>
    <text x="24" y="136" class="sub" font-size="13.5" font-weight="500">8년차 NLP &#183; AI 엔지니어입니다</text>
    <text x="24" y="160" class="sub" font-size="13.5" font-weight="500">문제 정의부터 개발&#183;기획&#183;운영 등</text>
    <text x="24" y="179" class="sub" font-size="13.5" font-weight="500">풀스택 영역에서 AI를 활용해</text>
    <text x="24" y="198" class="sub" font-size="13.5" font-weight="500">빠르게 구현합니다</text>
  </g>

  <line x1="380" y1="26" x2="380" y2="206" class="rule" stroke-width="1"/>

  <g>
    <g class="sans accent" font-size="13.5" letter-spacing="0.6" font-weight="700">
      <text x="408" y="60">근무지</text>
      <text x="408" y="130">핵심역량</text>
    </g>

    <g class="sans">
      <text x="408" y="86" class="ink" font-size="15" font-weight="500">넷마블 AI플랫폼 개발팀 &#183; 서울</text>
      <g class="sub" font-size="15">
        <text x="408" y="156"><tspan class="bullet">&#8226;</tspan>&#160;&#160;LLM 파이프라인 설계와 운영</text>
        <text x="408" y="178"><tspan class="bullet">&#8226;</tspan>&#160;&#160;업무 자동화 &#183; 에이전트 시스템</text>
        <text x="408" y="200"><tspan class="bullet">&#8226;</tspan>&#160;&#160;비개발 부서와의 협업과 소통</text>
      </g>
    </g>

    <line x1="408" y1="104" x2="736" y2="104" class="rule" stroke-width="1"/>
  </g>
</svg>
