<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 246" width="760" height="246" role="img"
     aria-label="우상명 Sangmyeong Woh, AI Engineer. 언어를 다루는 AI 시스템을 만듭니다. 근무지: 넷마블 AI플랫폼 개발팀, 서울. 경력: 7년, NLP 엔지니어에서 AI 엔지니어로. 핵심역량: LLM 파이프라인 설계와 운영, 업무 자동화와 에이전트 시스템, 비개발 부서와의 협업과 소통.">
  <title>우상명 · Sangmyeong Woh — AI Engineer</title>
  <style>
    :root { color-scheme: light dark; }
    .sans { font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif }
    .mono { font-family:ui-monospace,'SF Mono','Cascadia Mono',Consolas,'D2Coding',monospace }
    .ink    { fill:#16211F }
    .sub    { fill:#33403E }
    .muted  { fill:#6B7C79 }
    .accent { fill:#0B6B5C }
    .rule   { stroke:#D3DCD9 }
    @media (prefers-color-scheme: dark) {
      .ink{fill:#E6EDEA} .sub{fill:#BCC9C6} .muted{fill:#849692}
      .accent{fill:#6FDCC6} .rule{stroke:#2B3A38}
    }
  </style>

  <g class="sans">
    <text x="24" y="42" class="mono accent" font-size="13" letter-spacing="3.4" font-weight="700">AI ENGINEER</text>
    <text x="22" y="100" class="ink" font-size="44" font-weight="800" letter-spacing="-1.2">우상명</text>
    <text x="24" y="126" class="mono muted" font-size="13" letter-spacing="2.2" font-weight="600">SANGMYEONG WOH</text>
    <text x="24" y="172" class="sub" font-size="16" font-weight="500">언어를 다루는</text>
    <text x="24" y="196" class="sub" font-size="16" font-weight="500">AI 시스템을 만듭니다</text>
  </g>

  <line x1="342" y1="20" x2="342" y2="216" class="rule" stroke-width="1"/>

  <g>
    <g class="sans accent" font-size="13.5" letter-spacing="0.6" font-weight="700">
      <text x="374" y="38">근무지</text>
      <text x="374" y="102">경력</text>
      <text x="374" y="166">핵심역량</text>
    </g>

    <g class="sans">
      <text x="374" y="62" class="ink" font-size="15.5" font-weight="500">넷마블 AI플랫폼 개발팀 &#183; 서울</text>
      <text x="374" y="126" class="ink" font-size="15.5" font-weight="500">7년 &#8212; NLP 엔지니어에서 AI 엔지니어로</text>
      <g class="sub" font-size="15">
        <text x="374" y="190">LLM 파이프라인 설계와 운영</text>
        <text x="374" y="211">업무 자동화 &#183; 에이전트 시스템</text>
        <text x="374" y="232">비개발 부서와의 협업과 소통</text>
      </g>
    </g>

    <line x1="374" y1="78"  x2="736" y2="78"  class="rule" stroke-width="1"/>
    <line x1="374" y1="142" x2="736" y2="142" class="rule" stroke-width="1"/>
