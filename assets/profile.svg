<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 284" width="1200" height="284" role="img"
     aria-label="우상명 Sangmyeong Woh, AI Engineer. 언어를 다루는 AI 시스템을 만듭니다. 근무지: 넷마블 AI플랫폼 개발팀, 서울. 경력: 7년, NLP 엔지니어로 시작해 AI 엔지니어로. 핵심역량: LLM 파이프라인 설계와 운영, 업무 자동화와 에이전트 시스템, 비개발 부서와의 협업과 소통.">
  <title>우상명 · Sangmyeong Woh — AI Engineer</title>
  <style>
    :root { color-scheme: light dark; }
    .sans { font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif }
    .mono { font-family:ui-monospace,'SF Mono','Cascadia Mono',Consolas,'D2Coding',monospace }
    .ink    { fill:#16211F }
    .sub    { fill:#3E514E }
    .muted  { fill:#71837F }
    .accent { fill:#0E7C6B }
    .rule   { stroke:#D3DCD9 }
    @media (prefers-color-scheme: dark) {
      .ink{fill:#E6EDEA} .sub{fill:#B4C2BF} .muted{fill:#7F918D}
      .accent{fill:#5FD3BE} .rule{stroke:#2B3A38}
    }
  </style>

  <g class="sans">
    <text x="56" y="48" class="mono accent" font-size="12" letter-spacing="5.4" font-weight="700">AI ENGINEER</text>
    <text x="54" y="118" class="ink" font-size="54" font-weight="800" letter-spacing="-1.5">우상명</text>
    <text x="57" y="149" class="mono muted" font-size="14.5" letter-spacing="2.8" font-weight="600">SANGMYEONG WOH</text>
    <text x="56" y="212" class="sub" font-size="18.5" font-weight="500">언어를 다루는 AI 시스템을 만듭니다</text>
  </g>

  <line x1="640" y1="34" x2="640" y2="256" class="rule" stroke-width="1"/>

  <g>
    <g class="mono accent" font-size="10.5" letter-spacing="2.2" font-weight="700">
      <text x="686" y="46">근무지</text>
      <text x="686" y="110">경력</text>
      <text x="686" y="174">핵심역량</text>
    </g>

    <g class="sans" font-size="16" font-weight="500">
      <text x="686" y="72" class="ink">넷마블 AI플랫폼 개발팀 &#183; 서울</text>
      <text x="686" y="136" class="ink">7년 &#8212; NLP 엔지니어로 시작해 AI 엔지니어로</text>
      <g class="sub" font-size="15.5">
        <text x="686" y="200">LLM 파이프라인 설계와 운영</text>
        <text x="686" y="223">업무 자동화 &#183; 에이전트 시스템</text>
        <text x="686" y="246">비개발 부서와의 협업과 소통</text>
      </g>
    </g>

    <line x1="686" y1="88"  x2="1144" y2="88"  class="rule" stroke-width="1"/>
    <line x1="686" y1="152" x2="1144" y2="152" class="rule" stroke-width="1"/>
  </g>
</svg>
