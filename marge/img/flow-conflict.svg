<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 224" width="760" height="224" role="img" aria-label="1세대 문서 충돌 감지 흐름 — Q-cluster로 같은 주제의 조각을 모으고, 조각별로 같은 질문에 각각 답하게 한 뒤 상반된 답을 낸 원본 문서를 지목해 사용자에게 경고">
<style>
  .bg  { fill: #ffffff; }
  .pan { fill: #f4f8f7; stroke: #dce5e2; }
  .box { fill: #ffffff; stroke: #dce5e2; }
  .hot { stroke: #0b6b5c; }
  .ink { fill: #16211f; }
  .sub { fill: #33403e; }
  .mut { fill: #6b7c79; }
  .acc { fill: #0b6b5c; }
  .ln  { stroke: #33403e; }
  .mk  { fill: #33403e; }
  
    .bg  { fill: #0d1413; }
    .pan { fill: #101817; stroke: #26332f; }
    .box { fill: #0d1413; stroke: #26332f; }
    .hot { stroke: #6fdcc6; }
    .ink { fill: #e6edea; }
    .sub { fill: #bcc9c6; }
    .mut { fill: #849692; }
    .acc { fill: #6fdcc6; }
    .ln  { stroke: #bcc9c6; }
    .mk  { fill: #bcc9c6; }
  text { font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; }
  .t { font-size: 15px; font-weight: 700; }
  .s { font-size: 12.5px; }
  .k { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; }
  rect { stroke-width: 1.2; }
  .hot { stroke-width: 1.7; }
  .ln  { fill: none; stroke-width: 1.5; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" class="mk"/>
  </marker>
</defs>
<rect class="bg" x="0" y="0" width="100%" height="100%"/>

<!-- 3단 -->
<rect class="box" x="16" y="24" width="228" height="68" rx="10"/>
<text class="t ink" x="30" y="48">① 같은 주제 묶기</text>
<text class="s mut" x="30" y="68">Q-cluster로 여러 문서의</text>
<text class="s mut" x="30" y="83">관련 조각을 한자리에</text>

<rect class="box" x="266" y="24" width="228" height="68" rx="10"/>
<text class="t ink" x="280" y="48">② 각자 답하게 하기</text>
<text class="s mut" x="280" y="68">같은 질문을 조각별로</text>
<text class="s mut" x="280" y="83">따로따로 답변 (병렬)</text>

<rect class="box hot" x="516" y="24" width="228" height="68" rx="10"/>
<text class="t ink" x="530" y="48">③ 답 비교</text>
<text class="s mut" x="530" y="68">서로 반대되는 답을 낸</text>
<text class="s mut" x="530" y="83">조각 짝을 찾음</text>

<path class="ln" d="M244 58 L262 58" marker-end="url(#a)"/>
<path class="ln" d="M494 58 L512 58" marker-end="url(#a)"/>

<!-- 갈래 -->
<path class="ln" d="M630 92 L630 122"/>
<path class="ln" d="M374 122 L636 122"/>
<path class="ln" d="M374 122 L374 144" marker-end="url(#a)"/>
<path class="ln" d="M636 122 L636 144" marker-end="url(#a)"/>
<text class="k mut" x="300" y="118">일치</text>
<text class="k mut" x="648" y="118">상충</text>

<rect class="box" x="266" y="148" width="216" height="54" rx="9"/>
<text class="t sub" x="280" y="170">이상 없음</text>
<text class="s mut" x="280" y="189">문서 품질 통과</text>

<rect class="box" x="528" y="148" width="216" height="54" rx="9"/>
<text class="t sub" x="542" y="170">원본 문서 지목 · 경고</text>
<text class="s mut" x="542" y="189">사용자에게 상충 내용 안내</text>

<!-- 회고 -->
</svg>
