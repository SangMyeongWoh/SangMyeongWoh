<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" width="760" height="404" role="img" aria-label="MARGE 시스템 아키텍처(1·2세대 공용) — GKE 클러스터 위의 채팅·문서관리 서비스와 전처리 파이프라인, MongoDB·GCS·Vertex AI">
<style>
  .bg  { fill: #ffffff; }
  .pan { fill: #f4f5f8; stroke: #dde1ea; }
  .box { fill: #ffffff; stroke: #dde1ea; }
  .hot { stroke: #7a5c10; }
  .ink { fill: #151a24; }
  .sub { fill: #343a48; }
  .mut { fill: #6b7385; }
  .acc { fill: #7a5c10; }
  .ln  { stroke: #343a48; }
  .mk  { fill: #343a48; }
  @media (prefers-color-scheme: dark) {
    .bg  { fill: #10131a; }
    .pan { fill: #151922; stroke: #2a3040; }
    .box { fill: #10131a; stroke: #2a3040; }
    .hot { stroke: #e3c77a; }
    .ink { fill: #e9e8e4; }
    .sub { fill: #c5c5c0; }
    .mut { fill: #8e919b; }
    .acc { fill: #e3c77a; }
    .ln  { stroke: #c5c5c0; }
    .mk  { fill: #c5c5c0; }
  }
  text { font-family: 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; }
  .t { font-size: 15px; font-weight: 700; }
  .s { font-size: 12.5px; }
  .k { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; }
  rect { stroke-width: 1.2; }
  .hot { stroke-width: 1.7; }
  .ln  { fill: none; stroke-width: 1.5; }
  .dsh { stroke-dasharray: 4 3; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" class="mk"/>
  </marker>
</defs>
<rect class="bg" x="0" y="0" width="100%" height="100%"/>

<!-- 진입 -->
<rect class="box" x="270" y="10" width="220" height="40" rx="9"/>
<text class="t ink" x="380" y="35" text-anchor="middle">사내 챗봇 · 메신저</text>
<path class="ln" d="M380 50 L380 72" marker-end="url(#a)"/>

<!-- GKE 클러스터 -->
<rect class="pan" x="16" y="76" width="728" height="188" rx="12"/>
<text class="k acc" x="32" y="98">GKE 클러스터 — dev · real 2환경</text>

<rect class="box hot" x="32" y="108" width="340" height="64" rx="8"/>
<text class="t ink" x="44" y="132">채팅 API — 응답 엔진</text>
<text class="s mut" x="44" y="152">쿼리 이해 · 검색 · 답변 생성</text>

<rect class="box" x="32" y="184" width="164" height="56" rx="8"/>
<text class="s ink" x="42" y="206">임베딩·형태소 API</text>
<text class="s mut" x="42" y="224">검색 보조</text>

<rect class="box" x="208" y="184" width="164" height="56" rx="8"/>
<text class="s ink" x="218" y="206">대화 이력</text>

<rect class="box" x="404" y="108" width="324" height="56" rx="8"/>
<text class="t ink" x="416" y="132">문서 관리 API</text>
<text class="s mut" x="416" y="152">업로드 · FAQ · 동의어 관리</text>

<path class="ln" d="M566 164 L566 176" marker-end="url(#a)"/>

<rect class="box" x="404" y="180" width="324" height="68" rx="8"/>
<text class="t ink" x="416" y="204">전처리 파이프라인 — Airflow</text>
<text class="s mut" x="416" y="224">문서 파싱 → 세그먼트 → 벡터·키워드 인덱스</text>

<!-- 저장소·외부 의존 -->
<path class="ln" d="M132 264 L132 288" marker-end="url(#a)"/>
<path class="ln" d="M380 264 L380 288" marker-end="url(#a)"/>
<path class="ln dsh" d="M628 264 L628 288" marker-end="url(#a)"/>

<rect class="box" x="16" y="292" width="232" height="68" rx="9"/>
<text class="t sub" x="30" y="314">MongoDB</text>
<text class="s mut" x="30" y="334">문서 세그먼트 · 벡터 · FAQ</text>
<text class="s mut" x="30" y="350">챗봇마다 독립 DB</text>

<rect class="box" x="264" y="292" width="232" height="68" rx="9"/>
<text class="t sub" x="278" y="314">GCS</text>
<text class="s mut" x="278" y="334">원본 문서 · 설정</text>

<rect class="box dsh" x="512" y="292" width="232" height="68" rx="9"/>
<text class="t sub" x="526" y="314">LLM — Vertex AI</text>
<text class="s mut" x="526" y="334">답변 생성 · 판정 호출</text>

<text class="s mut" x="16" y="390">Airflow 및 GKE 환경과 인프라는 동료 담당</text>
</svg>
