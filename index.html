<style>
:root{
  --bg:#ffffff; --panel:#f4f8f7; --line:#dce5e2;
  --ink:#16211f; --sub:#33403e; --muted:#6b7c79; --accent:#0b6b5c;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0d1413; --panel:#101817; --line:#26332f;
         --ink:#e6edea; --sub:#bcc9c6; --muted:#849692; --accent:#6fdcc6; }
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg); color:var(--sub); line-height:1.7; font-size:16px;
  font-family:'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:860px;margin:0 auto;padding:56px 24px 72px}
.avatar{width:240px;height:240px;border-radius:50%;object-fit:cover;display:block;
        margin:0 auto 26px;border:1px solid var(--line);background:var(--panel)}
@media (max-width:560px){ .avatar{width:170px;height:170px;margin-bottom:20px} }
.sheet{display:flex;flex-direction:column;gap:16px}
.sheet img{display:block;width:100%}

/* 이미지 위에 얹는 클릭 영역 — README에서는 불가능한 부분 */
.hot{position:relative}
.hot a{position:absolute;border-radius:10px;display:block;
       outline:1px solid transparent;transition:background .15s,outline-color .15s}
.hot a:hover{background:rgba(11,107,92,.07);outline-color:var(--accent)}
@media (prefers-color-scheme: dark){ .hot a:hover{background:rgba(111,220,198,.10)} }
.hot a::after{content:attr(data-go);position:absolute;right:12px;top:50%;transform:translateY(-50%);
       font-size:12px;font-weight:700;color:var(--accent);opacity:0;transition:opacity .15s}
.hot a:hover::after{opacity:1}

/* 좌표는 work2.svg(760×236) 기준 백분율 */
.a-marbleai{left:3.9%;top:26%;width:45%;height:23%}
.a-marge {left:3.9%;top:55%;width:45%;height:23%}

.foot{margin-top:26px;display:flex;gap:22px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.foot a{color:var(--muted);text-decoration:none;border-bottom:1px solid transparent}
.foot a:hover{color:var(--accent);border-bottom-color:var(--accent)}
.side{margin-top:18px;padding:14px 18px;background:var(--panel);border:1px solid var(--line);
      border-radius:14px;font-size:14px;display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.side b{color:var(--ink);font-size:13px;letter-spacing:.02em}
.side a{color:var(--sub);text-decoration:none;border-bottom:1px solid var(--line)}
.side a:hover{color:var(--accent);border-bottom-color:var(--accent)}
.side small{color:var(--muted);font-size:12px;margin-left:4px}
.note{margin-top:10px;font-size:12.5px;color:var(--muted)}

/* ── 리디자인 감사 반영 ─────────────────────────── */
::selection{background:var(--accent);color:#06100e}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
h1,h2,h3{text-wrap:balance}
p,li{text-wrap:pretty}
.mono,.per,.when,.pin,.k{font-variant-numeric:tabular-nums}
a,button,summary{-webkit-tap-highlight-color:transparent}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;
                       scroll-behavior:auto !important}
}
.skip{position:absolute;left:-9999px;top:0;background:var(--accent);color:#06100e;
      padding:10px 16px;border-radius:0 0 10px 0;font-weight:700;z-index:50}
.skip:focus{left:0}
</style>
